name: CI

# Branch pushes are covered by their pull request, so only the default branch
# runs on push. Triggering on both would test every pull request commit twice.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Install gpm
        run: |
          go install github.com/cafecito-games/godot-package-manager/cmd/gpm@v0.5.1
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - run: scripts/test-package-addon
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
