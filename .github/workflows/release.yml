name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release (for example, 0.1.0 or 0.2.0-rc.1)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Manual releases always tag the latest default-branch commit, even
          # if a different branch was selected in the Actions UI.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION#v}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${version}" =~ ${semver} ]]; then
            echo "::error::Version must be semantic version syntax such as 0.1.0 or 0.2.0-rc.1"
            exit 1
          fi

          tag="v${version}"
          head_sha="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            tag_sha="$(git rev-list -n 1 "${tag}")"
            if [[ "${tag_sha}" != "${head_sha}" ]]; then
              echo "::error::${tag} already points to ${tag_sha}, not current main ${head_sha}"
              exit 1
            fi
            echo "Reusing ${tag} at ${head_sha} for a release retry"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "${tag}" --message "gdkit ${tag}"
            git push origin "refs/tags/${tag}"
            echo "Created ${tag} at ${head_sha}"
          fi

          echo "### Releasing ${tag}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Commit: \`${head_sha}\`" >> "${GITHUB_STEP_SUMMARY}"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
