# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gdkit

builds:
  - id: gdkit
    main: ./cmd/gdkit
    binary: gdkit
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X github.com/cafecito-games/gdkit/internal/buildinfo.version={{ .Version }}
        -X github.com/cafecito-games/gdkit/internal/buildinfo.commit={{ .FullCommit }}
        -X github.com/cafecito-games/gdkit/internal/buildinfo.date={{ .CommitDate }}
        -X github.com/cafecito-games/gdkit/internal/buildinfo.treeState={{ if .IsGitDirty }}dirty{{ else }}clean{{ end }}

archives:
  - id: binaries
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'

homebrew_casks:
  - name: gdkit
    repository:
      owner: cafecito-games
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/cafecito-games/gdkit"
    description: "Static-analysis toolkit for Godot 4 GDScript"
    # The release binaries are not notarized, so strip the quarantine attribute
    # on install to keep Gatekeeper from blocking the executable.
    #
    # This uses custom_block rather than hooks.post.install because GoReleaser
    # renders hook bodies inside Homebrew's deprecated `postflight` stanza,
    # which now warns on every install. custom_block emits the declarative
    # `postflight_steps` replacement directly.
    #
    # custom_block is templated exactly once, so {{staged_path}} is escaped to
    # survive that pass and reach Homebrew's step runner literally.
    custom_block: |
      postflight_steps do
        on_macos do
          if_path_exists "/usr/bin/xattr" do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/gdkit"]
          end
        end
      end

release:
  draft: false
  prerelease: auto
